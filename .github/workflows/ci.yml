name: CI

# The checks in this repo are behavioural — they drive real services against a
# recorded database and a real Express app over HTTP, and every one of them was
# written because something shipped broken. Nothing ran them automatically,
# which meant they were only as good as somebody's memory. This runs them.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Types, checks and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # shared/ has to be built before anything typechecks against it: server
      # and client both import from its compiled output.
      - name: Build shared
        run: npm run build:shared

      - name: Typecheck server and client
        run: npm run typecheck

      # The public API check also drives the real Zapier app against the server.
      - name: Install the Zapier app
        run: npm ci --prefix integrations/zapier

      # Bounce classification, the whole send path, per-step analytics, what an
      # enrolment actually did, campaign health, sending readiness, the API-key
      # chain, and the write-path audit.
      - name: Behavioural checks
        run: npm run check --workspace=server

      - name: Build
        run: |
          npm run build:server
          npm run build:client

  zapier:
    name: Zapier app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: integrations/zapier/package-lock.json

      - name: Install
        working-directory: integrations/zapier
        run: npm ci

      # Schema validation, and every trigger, action and search step by step.
      - name: Test
        working-directory: integrations/zapier
        run: npm test

  make:
    name: Make app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: |
          npm ci
          npm run build:shared
          npm ci --prefix integrations/make

      # Every section against Make's own schemas, every endpoint against the
      # public API, and the deployer against a stand-in for Make's SDK API.
      - name: Test
        run: npm test --prefix integrations/make

  extension:
    name: Extension suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: extension/tests/package-lock.json

      - name: Install test deps
        working-directory: extension/tests
        run: npm ci

      # These drive the real unpacked extension — service worker, content
      # scripts, popup, options page — so a browser is not optional.
      - name: Install Chromium
        working-directory: extension/tests
        run: npx playwright install --with-deps chromium

      - name: Run every suite
        working-directory: extension/tests
        run: node run.mjs
